# Offbeat AI Watch newsletter: email each new or changed issue through Kit.
#
# Switched off until the owner acts. Two settings switch it on (owner-steps-kit.md):
#   environment secret   KIT_API_KEY, stored in the "newsletter-send" environment
#                        ONLY (run 10 decision R10-11). Only job 2 runs in that
#                        environment, so only job 2 can read the key. It is used
#                        only as a request header and never printed.
#   repository variable  NEWSLETTER_ENABLED = true. The jobs outside the
#                        environment cannot see the key, so this plain on switch
#                        tells them whether to build anything. It is not a secret.
# With NEWSLETTER_ENABLED not "true", both jobs are skipped with one log line.
# Job 2 runs in the "newsletter-send" environment, so it waits for the owner's
# approval (and runs only for main) before anything reaches Kit. If the key is
# missing there, job 2 skips with one log line and nothing is sent.
#
# Optional repository variables:
#   KIT_SEGMENT_ID      Kit segment to send to (empty = all subscribers)
#   KIT_PUBLIC          "true" (default) or "false"
#   SEND_DELAY_MINUTES  minutes between approval and sending (default 30)
#
# Third-party actions are pinned to a full commit SHA; the version is in the
# comment next to each.
#
# Test without any network call: Actions, "Newsletter: email new issue",
# Run workflow, leave "dry_run" ticked. Or locally:
#   python scripts/newsletter_build_email.py --latest --out build/newsletter --dry-run
#   python scripts/newsletter_kit_broadcast.py --email build/newsletter/email.json --dry-run

name: "Newsletter: email new issue"

on:
  push:
    branches: [main]
    paths:
      - "issues/**"
  workflow_dispatch:
    inputs:
      issue_path:
        description: "Issue file, for example issues/2026-01-07.html (empty = the newest issue)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: build the email only, no call to Kit"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: newsletter-email
  cancel-in-progress: false

jobs:
  preflight:
    name: Check the key and find the issue
    if: github.repository == 'shashwatgtm/ai-trendwatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      issue: ${{ steps.check.outputs.issue }}
      dry_run: ${{ steps.check.outputs.dry_run }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the on switch and find the issue file
        id: check
        env:
          ENABLED: ${{ vars.NEWSLETTER_ENABLED }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          IN_PATH: ${{ inputs.issue_path }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          dry=false
          issue=""
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$IN_DRY" = "true" ]; then
            dry=true
          fi
          if [ "$ENABLED" != "true" ] && [ "$dry" != "true" ]; then
            echo "SKIPPED: the newsletter is switched off (the repository variable NEWSLETTER_ENABLED is not true), so the newsletter jobs are skipped. Nothing was built or sent." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if [ "$EVENT" = "workflow_dispatch" ]; then
              if [ -n "$IN_PATH" ]; then
                issue="$IN_PATH"
              else
                issue=$(ls issues/ | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$' | sort | tail -n 1 | sed 's#^#issues/#')
              fi
            elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              echo "::warning::Cannot compare with the previous commit, so nothing is built. Run the workflow by hand if an issue should be emailed."
            else
              changed=$(git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- issues/ | grep -E '^issues/[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$' || true)
              count=$(printf '%s\n' "$changed" | grep -c . || true)
              if [ "$count" -eq 0 ]; then
                echo "No issue page was added or changed in this push. Nothing to email." | tee -a "$GITHUB_STEP_SUMMARY"
              elif [ "$count" -gt 1 ]; then
                echo "$count issue pages changed in one push (a bulk edit, not one new issue). Nothing was built or sent. To email one of them, run this workflow by hand with its issue_path." | tee -a "$GITHUB_STEP_SUMMARY"
              else
                issue="$changed"
              fi
            fi
            if [ -n "$issue" ]; then
              if ! printf '%s' "$issue" | grep -Eq '^issues/[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$' || [ ! -f "$issue" ]; then
                echo "::error::'$issue' is not an issue file in this commit"
                exit 1
              fi
              echo "Issue to email: $issue (dry run: $dry)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo "issue=$issue"
            echo "dry_run=$dry"
          } >> "$GITHUB_OUTPUT"

  build-email:
    name: "Job 1: build the email"
    needs: preflight
    if: needs.preflight.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build the email (no network call)
        env:
          ISSUE: ${{ needs.preflight.outputs.issue }}
          DRY: ${{ needs.preflight.outputs.dry_run }}
        run: |
          set -euo pipefail
          flag=""
          if [ "$DRY" = "true" ]; then flag="--dry-run"; fi
          python3 scripts/newsletter_build_email.py --issue "$ISSUE" --out build/newsletter $flag | tee build-log.txt
          cat build/newsletter/summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Show the Kit request that would be sent (dry run only, no network call)
        if: needs.preflight.outputs.dry_run == 'true'
        run: python3 scripts/newsletter_kit_broadcast.py --email build/newsletter/email.json --dry-run

      - name: Upload the email
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: newsletter-email
          path: build/newsletter/
          retention-days: 30

  send:
    name: "Job 2: create and schedule the Kit broadcast (after approval)"
    needs: [preflight, build-email]
    if: needs.preflight.outputs.issue != '' && needs.preflight.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: newsletter-send
    steps:
      # The key is a secret of the newsletter-send environment, so only this job can read it. This step only
      # asks whether it is set (true or false); the value is never printed.
      - name: Check the key
        id: key
        env:
          HAS_KEY: ${{ secrets.KIT_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "The KIT_API_KEY secret of the newsletter-send environment is set."
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "SKIPPED: the KIT_API_KEY secret of the newsletter-send environment is not set, so no Kit broadcast was created. Nothing was sent." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.key.outputs.has_key == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the email built by job 1
        if: steps.key.outputs.has_key == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: newsletter-email
          path: build/newsletter

      - name: Create and schedule the Kit broadcast
        if: steps.key.outputs.has_key == 'true'
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_SEGMENT_ID: ${{ vars.KIT_SEGMENT_ID }}
          KIT_PUBLIC: ${{ vars.KIT_PUBLIC }}
          SEND_DELAY_MINUTES: ${{ vars.SEND_DELAY_MINUTES }}
        run: python3 scripts/newsletter_kit_broadcast.py --email build/newsletter/email.json
